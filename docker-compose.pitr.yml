services:
  db:
    image: converge-postgres-backup:local
    build:
      context: ./backend
      dockerfile: ../deploy/postgres-backup/Dockerfile
    container_name: postgres-safe
    restart: unless-stopped
    stop_grace_period: 1m
    env_file:
      - .env
    environment:
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "5432:5432"
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=converge archive-push %p
      - -c
      - archive_timeout=15min
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgsocket:/var/run/postgresql
      - ${PGBACKREST_CONFIG_FILE:?Set PGBACKREST_CONFIG_FILE to an absolute private config path}:/etc/pgbackrest/pgbackrest.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backup-worker:
    image: converge-postgres-backup:local
    restart: unless-stopped
    user: postgres
    environment:
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      PITR_WORKER_TOKEN: ${PITR_WORKER_TOKEN:?Set PITR_WORKER_TOKEN in .env.pitr}
    entrypoint: ["/usr/local/bin/converge-backup-worker"]
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:${PITR_WORKER_BIND_PORT:-8099}:8099"
    volumes:
      - pgdata:/var/lib/postgresql/data:ro
      - pgsocket:/var/run/postgresql
      - backupstatus:/var/lib/converge-backup
      - pitrpreview:/var/lib/converge-preview
      - ${PGBACKREST_CONFIG_FILE:?Set PGBACKREST_CONFIG_FILE to an absolute private config path}:/etc/pgbackrest/pgbackrest.conf:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/converge-backup-worker", "health"]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 45m

  adminer:
    image: adminer:4-standalone
    container_name: adminer
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db

  pitr-restore:
    image: converge-postgres-backup:local
    profiles: ["pitr-restore"]
    user: postgres
    entrypoint: ["pgbackrest"]
    command:
      - --stanza=converge
      - --type=time
      - --target=${PITR_TARGET:-MISSING_TARGET}
      - --target-action=promote
      - restore
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - pitrdata:/var/lib/postgresql/data
      - ${PGBACKREST_CONFIG_FILE:?Set PGBACKREST_CONFIG_FILE to an absolute private config path}:/etc/pgbackrest/pgbackrest.conf:ro

  pitr-recover-latest:
    image: converge-postgres-backup:local
    profiles: ["pitr-restore"]
    user: postgres
    entrypoint: ["pgbackrest"]
    command: ["--stanza=converge", "--type=default", "restore"]
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - pitrdata:/var/lib/postgresql/data
      - ${PGBACKREST_CONFIG_FILE:?Set PGBACKREST_CONFIG_FILE to an absolute private config path}:/etc/pgbackrest/pgbackrest.conf:ro

  pitr-db:
    image: converge-postgres-backup:local
    profiles: ["pitr-restore"]
    user: postgres
    stop_grace_period: 1m
    entrypoint: ["docker-entrypoint.sh"]
    command: ["postgres"]
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pitrdata:/var/lib/postgresql/data
      - ${PGBACKREST_CONFIG_FILE:?Set PGBACKREST_CONFIG_FILE to an absolute private config path}:/etc/pgbackrest/pgbackrest.conf:ro

volumes:
  pgdata:
  pgsocket:
  backupstatus:
  pitrdata:
  pitrpreview:
