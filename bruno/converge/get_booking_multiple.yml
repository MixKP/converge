info:
  name: get_booking_multiple
  type: http
  seq: 27

http:
  method: POST
  url: http://localhost:8080/api/bookings
  body:
    type: json
    data: |-
      {
          "subject_id": 1,
          "branch_id": 1,
          "preferred_slots": [
            {"day_of_week": 0, "start": "09:00", "end": "10:00"},
            {"day_of_week": 4, "start": "12:00", "end": "14:00"}
          ],
          "duration_minutes": 60
        }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
