services:
  db:
    container_name: converge-pitr-test-postgres
    ports: !override
      - "127.0.0.1:5432:5432"

  silo:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --certs-dir /certs --console-address :9001
    environment:
      MINIO_ROOT_USER: ${PITR_SILO_USER:?Set PITR_SILO_USER in .env.pitr}
      MINIO_ROOT_PASSWORD: ${PITR_SILO_PASSWORD:?Set PITR_SILO_PASSWORD in .env.pitr}
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
      - ./deploy/postgres-backup/silo-certs:/certs:ro

  silo-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      - silo
    environment:
      MINIO_ROOT_USER: ${PITR_SILO_USER:?Set PITR_SILO_USER in .env.pitr}
      MINIO_ROOT_PASSWORD: ${PITR_SILO_PASSWORD:?Set PITR_SILO_PASSWORD in .env.pitr}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        attempt=0
        until mc --insecure alias set local https://silo:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 30 ]; then exit 1; fi
          sleep 2
        done
        mc --insecure mb --ignore-existing local/converge-pitr

  backup-worker:
    depends_on:
      silo-init:
        condition: service_completed_successfully

volumes:
  miniodata:
