basePath: /api
definitions:
  models.AvailabilityPayload:
    properties:
      teacher_id:
        example: 42
        type: integer
      weekly:
        items:
          $ref: '#/definitions/models.WeeklySlot'
        type: array
    type: object
  models.Branch:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  models.ErrorResponse:
    properties:
      error:
        example: failed to retrieve teachers
        type: string
    type: object
  models.MessageResponse:
    properties:
      message:
        example: Availability saved successfully
        type: string
    type: object
  models.Subject:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  models.Teacher:
    properties:
      email:
        example: alice@example.com
        type: string
      id:
        example: 1
        type: integer
      name:
        example: Alice
        type: string
    type: object
  models.TeacherAvailability:
    properties:
      teacher:
        $ref: '#/definitions/models.Teacher'
      weekly:
        items:
          $ref: '#/definitions/models.WeeklySlot'
        type: array
    type: object
  models.WeeklySlot:
    properties:
      day_of_week:
        description: 0=Monday ... 6=Sunday
        example: 0
        type: integer
      end:
        example: "10:00"
        type: string
      start:
        example: "09:00"
        type: string
    type: object
info:
  contact: {}
  description: API for teacher availability management and bookings
  title: Converge API
  version: "1.0"
paths:
  /availability:
    get:
      description: Returns all active teachers with their weekly availability slots,
        grouped by teacher
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.TeacherAvailability'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get all teacher availability
      tags:
      - availability
    post:
      consumes:
      - application/json
      description: Replaces all existing availability for a teacher with the provided
        weekly schedule (full replace, not merge). Rejects overlapping slots within
        the same day.
      parameters:
      - description: 'Weekly availability payload. day_of_week: 0=Monday through 6=Sunday'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.AvailabilityPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Submit weekly availability
      tags:
      - availability
  /branches:
    get:
      description: Returns all branches ordered by id
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Branch'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: List branches
      tags:
      - branches
  /subjects:
    get:
      description: Returns all subjects ordered by id
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Subject'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: List subjects
      tags:
      - subjects
  /teachers:
    get:
      description: Returns all teachers with active status, ordered by name. Optionally
        filter by subject_id.
      parameters:
      - description: Filter by subject ID
        in: query
        name: subject_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Teacher'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: List active teachers
      tags:
      - teachers
swagger: "2.0"
