basePath: /api
definitions:
  branch.Branch:
    properties:
      capacity:
        example: 30
        type: integer
      id:
        example: 1
        type: integer
      name:
        example: Siam
        type: string
    type: object
  scheduling.Booking:
    properties:
      branch_id:
        type: integer
      client_name:
        type: string
      created_at:
        type: string
      end_time:
        type: string
      id:
        type: integer
      start_time:
        type: string
      subject_id:
        type: integer
      teacher_id:
        type: integer
    type: object
  scheduling.BookingAlternative:
    properties:
      branch_id:
        type: integer
      commute_minutes:
        type: integer
      end_time:
        type: string
      reasons:
        items:
          type: string
        type: array
      score:
        type: integer
      start_time:
        type: string
      subject_id:
        type: integer
      teacher_id:
        type: integer
      teacher_name:
        type: string
    type: object
  scheduling.BookingRequest:
    properties:
      branch_id:
        example: 1
        type: integer
      duration_minutes:
        example: 60
        type: integer
      preferred_slots:
        items:
          $ref: '#/definitions/shared.WeeklySlot'
        type: array
      preferred_teacher_id:
        example: 5
        type: integer
      required_gender:
        enum:
        - male
        - female
        - lgbtq+
        example: female
        type: string
      subject_id:
        example: 1
        type: integer
    required:
    - branch_id
    - preferred_slots
    - required_gender
    - subject_id
    type: object
  scheduling.BookingResponse:
    properties:
      results:
        items:
          $ref: '#/definitions/scheduling.SlotResult'
        type: array
    type: object
  scheduling.ConfirmBookingRequest:
    properties:
      branch_id:
        example: 1
        type: integer
      client_name:
        example: John Doe
        type: string
      end_time:
        example: "2026-06-01T10:00:00Z"
        type: string
      start_time:
        example: "2026-06-01T09:00:00Z"
        type: string
      subject_id:
        example: 1
        type: integer
      teacher_id:
        example: 1
        type: integer
    required:
    - branch_id
    - client_name
    - end_time
    - start_time
    - subject_id
    - teacher_id
    type: object
  scheduling.ErrorResponse:
    properties:
      error:
        example: failed to retrieve teachers
        type: string
    type: object
  scheduling.MessageResponse:
    properties:
      message:
        example: Availability saved successfully
        type: string
    type: object
  scheduling.SlotResult:
    properties:
      alternatives:
        items:
          $ref: '#/definitions/scheduling.BookingAlternative'
        type: array
      exact_match:
        $ref: '#/definitions/scheduling.BookingAlternative'
      message:
        type: string
      slot:
        $ref: '#/definitions/shared.WeeklySlot'
    type: object
  shared.Subject:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  shared.WeeklySlot:
    properties:
      day_of_week:
        description: 0=Sunday ... 6=Saturday (matches JavaScript Date.getDay())
        example: 0
        type: integer
      end:
        example: "10:00"
        type: string
      start:
        example: "09:00"
        type: string
    type: object
  teacher.CreateTeacherRequest:
    properties:
      email:
        example: alice@example.com
        type: string
      gender:
        example: female
        type: string
      name:
        example: Alice
        type: string
    required:
    - email
    - gender
    - name
    type: object
  teacher.Teacher:
    properties:
      email:
        example: alice@example.com
        type: string
      gender:
        example: female
        type: string
      id:
        example: 1
        type: integer
      name:
        example: Alice
        type: string
      status:
        example: active
        type: string
    type: object
  teacher.TeacherAvailability:
    properties:
      teacher:
        $ref: '#/definitions/teacher.Teacher'
      weekly:
        items:
          $ref: '#/definitions/shared.WeeklySlot'
        type: array
    type: object
  teacher.UpdateGenderRequest:
    properties:
      gender:
        example: female
        type: string
    required:
    - gender
    type: object
  teacher.UpdateStatusRequest:
    properties:
      status:
        example: deactivated
        type: string
    required:
    - status
    type: object
info:
  contact: {}
  description: API for teacher availability management and bookings
  title: Converge API
  version: "1.0"
paths:
  /availability:
    get:
      description: Returns all active teachers with their weekly availability slots,
        grouped by teacher
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/teacher.TeacherAvailability'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/scheduling.ErrorResponse'
      summary: Get all teacher availability
      tags:
      - availability
    post:
      consumes:
      - application/json
      description: Replaces all existing availability for a teacher with the provided
        weekly schedule (full replace, not merge). Rejects overlapping slots within
        the same day.
      parameters:
      - description: Weekly availability payload
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/scheduling.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/scheduling.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/scheduling.ErrorResponse'
      summary: Submit weekly availability
      tags:
      - availability
  /bookings:
    get:
      description: Returns all bookings sorted by creation date descending.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/scheduling.Booking'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/scheduling.ErrorResponse'
      summary: List all confirmed bookings
      tags:
      - bookings
    post:
      consumes:
      - application/json
      description: Evaluates each preferred_slot independently and returns per-slot
        results with either an exact_match or alternatives.
      parameters:
      - description: Booking request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/scheduling.BookingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/scheduling.BookingResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/scheduling.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/scheduling.ErrorResponse'
      summary: Evaluate a booking request
      tags:
      - bookings
  /bookings/{id}:
    delete:
      description: Deletes a confirmed booking by ID. Returns 404 if not found.
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/scheduling.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/scheduling.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/scheduling.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/scheduling.ErrorResponse'
      summary: Cancel a booking
      tags:
      - bookings
  /bookings/confirm:
    post:
      consumes:
      - application/json
      description: Creates the actual booking in the database after the client selects
        a result from the evaluate endpoint.
      parameters:
      - description: Booking confirmation
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/scheduling.ConfirmBookingRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/scheduling.Booking'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/scheduling.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/scheduling.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/scheduling.ErrorResponse'
      summary: Confirm a booking
      tags:
      - bookings
  /branches:
    get:
      description: Returns all branches ordered by id
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/branch.Branch'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/scheduling.ErrorResponse'
      summary: List branches
      tags:
      - branches
  /subjects:
    get:
      description: Returns all subjects ordered by id
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/shared.Subject'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/scheduling.ErrorResponse'
      summary: List subjects
      tags:
      - subjects
  /teachers:
    get:
      description: Returns all teachers with active status, ordered by name. Optionally
        filter by subject_id.
      parameters:
      - description: Filter by subject ID
        in: query
        name: subject_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/teacher.Teacher'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/scheduling.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/scheduling.ErrorResponse'
      summary: List active teachers
      tags:
      - teachers
    post:
      consumes:
      - application/json
      description: Adds a new teacher with name, email, and gender
      parameters:
      - description: New teacher payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/teacher.CreateTeacherRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/teacher.Teacher'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/scheduling.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/scheduling.ErrorResponse'
      summary: Create a teacher
      tags:
      - teachers
  /teachers/{id}/gender:
    patch:
      consumes:
      - application/json
      description: Sets a teacher's gender to male, female, or lgbtq+
      parameters:
      - description: Teacher ID
        in: path
        name: id
        required: true
        type: integer
      - description: New gender
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/teacher.UpdateGenderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/scheduling.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/scheduling.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/scheduling.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/scheduling.ErrorResponse'
      summary: Update a teacher's gender
      tags:
      - teachers
  /teachers/{id}/status:
    patch:
      consumes:
      - application/json
      description: Sets a teacher's status to active or deactivated
      parameters:
      - description: Teacher ID
        in: path
        name: id
        required: true
        type: integer
      - description: New status
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/teacher.UpdateStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/scheduling.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/scheduling.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/scheduling.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/scheduling.ErrorResponse'
      summary: Toggle teacher active/deactivated status
      tags:
      - teachers
swagger: "2.0"
