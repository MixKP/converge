services:
  recovery-db:
    image: postgres:16-alpine
    profiles: ["restore"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: converge_restore
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - recoverydata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d converge_restore"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  recoverydata:
