services:
  silo-live:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --certs-dir /certs --console-address :9001
    environment:
      MINIO_ROOT_USER: ${SILO_ROOT_USER:?Set SILO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD:?Set SILO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - silodata:/data
      - ${SILO_CERT_DIR:?Set SILO_CERT_DIR}:/certs:ro
    networks:
      - backup

  silo-live-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      - silo-live
    environment:
      MINIO_ROOT_USER: ${SILO_ROOT_USER:?Set SILO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD:?Set SILO_ROOT_PASSWORD}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        attempt=0
        until mc --insecure alias set local https://silo-live:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 30 ]; then exit 1; fi
          sleep 2
        done
        mc --insecure mb --ignore-existing local/converge-live-pitr
    networks:
      - backup

networks:
  backup:
    name: converge-backup

volumes:
  silodata:
